-run_mode=true
#"程序的运行模式，false-调试，true-发布"
-log_file=/chatsystem/logs/file.log
#"发布模式下，用于指定日志的输出文件"
-log_level=0
#"发布模式下，用于指定日志输出等级"

-registry_host=http://192.168.22.129:2379
#"服务注册中心地址"
-base_service=/service
#"服务监控根目录"
-instance_name=/file_service/instance
#"当前实例名称"
-access_host=192.168.22.129:10002
#"当前实例的外部访问地址"

-listen_port=10002
#"Rpc服务器监听端口"
-rpc_timeout=-1
#"Rpc调用超时时间"
-rpc_threads=1
#"Rpc的IO线程数量"

-storage_path=/chatsystem/data
#"文件存储的默认文件夹"